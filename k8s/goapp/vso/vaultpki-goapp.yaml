apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: goapp-pki
spec:
  vaultAuthRef: vaultauth
  expiryOffset: 10s
  ttl: 30d
  clear: true
  destination:
    create: true
    name: goapp-tls
    overwrite: true
    transformation: {}
    type: kubernetes.io/tls
  role: lab-vigne-com-br
  commonName: goapp.lab.vigne.com.br
  format: pem
  mount: pki-k3s-vigne-com-br
  altNames:
    - goapp.lab.vigne.com.br