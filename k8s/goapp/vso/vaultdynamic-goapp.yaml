apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: goapp-creds
spec:
  mount: pgsql-vigne-com-br
  path: creds/goapp
  destination:
    create: true
    name: goapp-connection
    overwrite: true
    transformation:
      excludes:
        - .*
      templates:
        POSTGRES_URL:
          text: >-
            postgres://{{ get .Secrets "username" }}:{{ get .Secrets "password" }}@psql.vigne.com.br:5432/goapp?sslmode=disable
  rolloutRestartTargets:
    - kind: Deployment
      name: goapp
  vaultAuthRef: vaultauth