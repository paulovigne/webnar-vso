apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goapp
spec:
  rules:
  - host: goapp.lab.vigne.com.br
    http:
      paths:
      - backend:
          service:
            name: goapp
            port:
              number: 8080
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: frontend
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
    - hosts:
        - goapp.lab.vigne.com.br
      secretName: goapp-tls