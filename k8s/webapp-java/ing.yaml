apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  labels:
    app: webapp    
spec:
  rules:
  - host: webapp.lab.vigne.com.br
    http:
      paths:
      - backend:
          service:
            name: webapp
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
    - hosts:
        - webapp.lab.vigne.com.br
      secretName: webapp-tls