apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app2-static
  namespace: app2
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-secretstore
    kind: SecretStore
  target:
    name: app2-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: USERNAME
      remoteRef:
        key: "secret-dev-local/data/data/app2/app-secret"
        property: "user"
    - secretKey: PASSWORD
      remoteRef:
        key: "secret-dev-local/data/data/app2/app-secret"
        property: "pass"