apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secretstore
  namespace: app2
spec:
  provider:
    vault:
      server: "https://vault.vigne.com.br:8200"
      version: "v2"
      caProvider:
        type: "Secret"
        name: "vault-ca-cert-secret"
        key: "ca.crt"
      auth:
        kubernetes:
          mountPath: "k3s-vigne-com-br"
          role: "k3s-vigne-com-br"
          serviceAccountRef:
            name: "vault-eso"
            audiences:
            - "k3s-vigne-com-br"